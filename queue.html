<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Aplikasi Print Piagam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">PiagamFast</div>
                        <nav class="sidebar-nav">
                <a href="index.html" id="nav-index">Dashboard</a>
                <a href="participants.html" id="nav-participants">Data Peserta</a>
                <a href="import.html" id="nav-import">Import</a>
                <a href="queue.html" id="nav-queue">Antrean</a>
                <a href="setting.html" id="nav-setting">Setting</a>
                <a href="#" onclick="window.fbLogout(); return false;" style="color: #dc2828; margin-top: 20px;">🚪 Keluar</a>
            </nav>
        </aside>
        <main class="main-content">
            <div class="container">

<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Daftar Antrean Print (Pending)</h2>
        <div style="display:flex; gap:8px;">
            <button onclick="window.open('batch.html', '_blank')" class="btn btn-primary btn-sm">Cetak Masal Semua</button>
            <button onclick="clearQueue()" class="btn btn-danger btn-sm">Hapus Semua</button>
        </div>
    </div>
    <table class="table mt-2">
        <thead>
            <tr>
                <th>Nama</th>
                <th>Detail Data</th>
                <th style="text-align:right;">Aksi</th>
            </tr>
        </thead>
        <tbody id="pending-tbody">
            <tr><td colspan="3" style="text-align:center;">Memuat antrean dari Firebase...</td></tr>
        </tbody>
    </table>
    <div class="mt-2">
        <button onclick="markAllPrinted()" class="btn btn-secondary">Tandai Semua Sudah Di-Print</button>
    </div>
</div>

<div class="card mt-3">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Riwayat Cetak (Sudah Di-Print)</h2>
        <button onclick="downloadHistoryCSV()" class="btn btn-secondary btn-sm">Download Riwayat (CSV)</button>
    </div>
    <table class="table mt-2">
        <thead>
            <tr>
                <th>Nama</th>
                <th>Detail Data</th>
                <th style="text-align:right;">Aksi</th>
            </tr>
        </thead>
        <tbody id="printed-tbody">
            <tr><td colspan="3" style="text-align:center;">Memuat riwayat dari Firebase...</td></tr>
        </tbody>
    </table>
</div>

            </div>
        </main>
    </div>
    <script type="module" src="js/firebase-init.js"></script>
    <script src="js/app.js"></script>
    <script>
        const path = window.location.pathname;
        if(path.endsWith('participants.html')) document.getElementById('nav-participants').classList.add('active');
        else if(path.endsWith('import.html')) document.getElementById('nav-import').classList.add('active');
        else if(path.endsWith('queue.html')) document.getElementById('nav-queue').classList.add('active');
        else if(path.endsWith('setting.html')) document.getElementById('nav-setting').classList.add('active');
        else document.getElementById('nav-index').classList.add('active');
    </script>
<script>
(() => {
let queuesData = [];
let templatesMeta = {};

// Get templates meta to show friendly names
const checkFb = setInterval(() => {
    if(window.fbDb && window.fbUser) {
        clearInterval(checkFb);
        
        window.fbOnValue(window.getAppRef('settings/templates_meta'), (snap) => {
            templatesMeta = snap.val() || {};
            renderQueues(); // re-render if template name changes or loads
        });
        
        window.fbOnValue(window.getAppRef('queue'), (snapshot) => {
            const data = snapshot.val();
            queuesData = data ? Object.keys(data).map(k => ({id: k, ...data[k]})) : [];
            queuesData.sort((a,b) => b.timestamp - a.timestamp);
            renderQueues();
        });
    }
}, 50);

function renderQueues() {
    const pending = queuesData.filter(q => q.status === 'pending');
    const printed = queuesData.filter(q => q.status === 'printed');
    
    function formatDynamicData(q) {
        if (!q.dynamic_data) return escapeHTML(q.category || '-');
        const vals = Object.values(q.dynamic_data).filter(v => v).slice(0, 3);
        let str = vals.map(v => escapeHTML(v)).join(', ');
        if (Object.keys(q.dynamic_data).length > 3) str += '...';
        return str || '-';
    }
    
    const pendingHtml = pending.length ? pending.map(q => {
        const tplId = q.template_id || 'default';
        const tplName = tplId === 'default' ? 'Piagam Default' : (templatesMeta[tplId]?.name || 'Template Baru');
        return `
        <tr id="queue-${q.id}">
            <td>
                ${escapeHTML(q.participant_name)}
                <span class="badge" style="background:#34495e; color:#fff; font-size:10px; margin-left:8px; padding:3px 6px; vertical-align:middle;">
                    ${escapeHTML(tplName)}
                </span>
            </td>
            <td><small>${formatDynamicData(q)}</small></td>
            <td style="text-align:right; min-width: 150px;">
                <button onclick="window.open('batch.html?id=${q.id}', '_blank')" class="btn btn-primary btn-sm">Print</button>
                <button onclick="deleteQueue('${q.id}')" class="btn btn-danger btn-sm">Hapus</button>
            </td>
        </tr>
    `}).join('') : '<tr><td colspan="3" style="text-align:center; color:#999;">Antrean kosong.</td></tr>';
    
    const printedHtml = printed.length ? printed.map(q => {
        const tplId = q.template_id || 'default';
        const tplName = tplId === 'default' ? 'Piagam Default' : (templatesMeta[tplId]?.name || 'Template Baru');
        return `
        <tr id="queue-${q.id}">
            <td>
                ${escapeHTML(q.participant_name)}
                <span class="badge" style="background:#34495e; color:#fff; font-size:10px; margin-left:8px; padding:3px 6px; vertical-align:middle;">
                    ${escapeHTML(tplName)}
                </span>
            </td>
            <td><small>${formatDynamicData(q)}</small></td>
            <td style="text-align:right; min-width: 210px;">
                <button onclick="window.open('batch.html?id=${q.id}', '_blank')" class="btn btn-primary btn-sm">Print Ulang</button>
                <button onclick="rollbackQueue('${q.id}')" class="btn btn-warning btn-sm">Rollback</button>
                <button onclick="deleteQueue('${q.id}')" class="btn btn-danger btn-sm">Hapus</button>
            </td>
        </tr>
    `}).join('') : '<tr><td colspan="3" style="text-align:center; color:#999;">Belum ada riwayat.</td></tr>';
    
    document.getElementById('pending-tbody').innerHTML = pendingHtml;
    document.getElementById('printed-tbody').innerHTML = printedHtml;
}

window.deleteQueue = async (id) => {
    if(confirm('Yakin hapus dari antrean?')) {
        await window.fbRemove(window.getAppRef(`queue/${id}`));
    }
};

window.clearQueue = async () => {
    if(confirm('Hapus semua antrean (pending & riwayat)?')) {
        let updates = {};
        queuesData.forEach(q => updates[q.id] = null);
        await window.fbUpdate(window.getAppRef('queue'), updates);
    }
};

window.markAllPrinted = async () => {
    const pending = queuesData.filter(q => q.status === 'pending');
    if(pending.length === 0) return;
    if(confirm('Tandai semua sebagai sudah dicetak?')) {
        let updates = {};
        pending.forEach(q => updates[q.id + '/status'] = 'printed');
        if(Object.keys(updates).length > 0) {
            await window.fbUpdate(window.getAppRef('queue'), updates);
        }
    }
};

window.rollbackQueue = async (id) => {
    if(confirm('Kembalikan ke antrean cetak?')) {
        await window.fbUpdate(window.getAppRef(`queue/${id}`), { status: 'pending', timestamp: Date.now() });
    }
};

window.downloadHistoryCSV = () => {
    const printed = queuesData.filter(q => q.status === 'printed');
    if(printed.length === 0) {
        alert('Tidak ada riwayat cetak untuk didownload.');
        return;
    }
    
    // Determine all unique keys from dynamic_data across all printed items
    let dynamicKeys = new Set();
    printed.forEach(q => {
        if(q.dynamic_data) {
            Object.keys(q.dynamic_data).forEach(k => dynamicKeys.add(k));
        }
    });
    const dynCols = Array.from(dynamicKeys);
    
    // Build CSV Header
    let csvStr = 'Waktu Cetak,Template Piagam,Nama Peserta';
    if (dynCols.length > 0) csvStr += ',' + dynCols.map(k => `"${k}"`).join(',');
    csvStr += '\n';
    
    // Build CSV Rows
    printed.forEach(q => {
        const date = new Date(q.timestamp).toLocaleString('id-ID');
        const tplId = q.template_id || 'default';
        const tplName = tplId === 'default' ? 'Piagam Default' : (templatesMeta[tplId]?.name || tplId);
        
        let row = `"${date}","${tplName}","${q.participant_name || ''}"`;
        if (dynCols.length > 0) {
            dynCols.forEach(k => {
                let val = '';
                if(q.dynamic_data && q.dynamic_data[k]) val = q.dynamic_data[k];
                row += `,"${val}"`;
            });
        }
        csvStr += row + '\n';
    });
    
    // Download
    const blob = new Blob([csvStr], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'Riwayat_Cetak_Piagam.csv';
    link.click();
    URL.revokeObjectURL(url);
};
})();
</script>
</body>
</html>
