<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
        <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://www.gstatic.com; connect-src 'self' https://*.firebasedatabase.app https://generativelanguage.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
    <title>Batch Print Piagam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Alex+Brush&family=Allura&family=Cinzel:wght@400;700&family=Dancing+Script&family=Great+Vibes&family=Lora:ital,wght@0,400;0,700;1,400&family=Merriweather:wght@400;700&family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Oswald:wght@400;600&family=Parisienne&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@400;600;700&family=PT+Serif:wght@400;700&family=Roboto:wght@400;500;700&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/print.css">
    <script type="module" src="js/firebase-init.js"></script>
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }
        @media print {
            body {
                margin: 0;
                padding: 0;
                background: transparent;
                -webkit-print-color-adjust: exact;
            }
            .print-wrapper {
                page-break-after: always;
                page-break-inside: avoid;
            }
            .print-wrapper:last-child {
                page-break-after: auto;
            }
            .print-page {
                width: 1123px;
                height: 794px;
                position: relative;
                overflow: hidden;
                background: none !important;
            }
            .no-print {
                display: none !important;
            }
        }
        
        /* Layout for Browser Preview (2 columns) */
        @media screen {
            body {
                background: #525659;
            }
            #page-container {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(505px, 1fr));
                gap: 30px;
                padding: 30px;
                max-width: 1100px;
                margin: 0 auto;
            }
            .print-wrapper {
                width: 505px;
                height: 357px;
                background: white;
                box-shadow: 0 4px 10px rgba(0,0,0,0.5);
                overflow: hidden;
            }
            .print-page {
                transform: scale(0.45);
                transform-origin: top left;
                width: 1123px;
                height: 794px;
                position: relative;
                background: white no-repeat center center;
                background-size: 100% 100%;
            }
        }

        .field-name, .field-category, .field-nomor {
            position: absolute;
            width: 100%;
        }
    </style>
    <script src="js/security.js"></script>
</head>
<body>
    <div class="no-print" style="padding: 20px; background: #eee; text-align: center;">
        <button onclick="window.print()" style="padding:10px 20px; font-size:18px; cursor:pointer;">Mulai Print</button>
        <p>Pastikan pengaturan printer: Landscape, Margins: None, Paper: A4, Background Graphics: Off</p>
    </div>
    
    <div id="page-container">
        <p style="color:white; text-align:center; width:100%;">Memuat antrean dari Firebase...</p>
    </div>

    <script>
    function escapeHTML(str) {
        if (!str) return '';
        return str.toString().replace(/[&<>'"]/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag] || tag));
    }

    const loadedFonts = new Set();
    function loadGoogleFont(fontFamily) {
        if (!fontFamily || fontFamily === 'Arial' || fontFamily === 'Times New Roman' || loadedFonts.has(fontFamily)) return;
        const link = document.createElement('link');
        link.href = 'https://fonts.googleapis.com/css2?family=' + fontFamily.replace(/ /g, '+') + '&display=swap';
        link.rel = 'stylesheet';
        document.head.appendChild(link);
        loadedFonts.add(fontFamily);
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Wait until firebase-init is loaded and attached to window
        const checkFb = setInterval(async () => {
            if(window.fbDb) {
                clearInterval(checkFb);
                const urlParams = new URLSearchParams(window.location.search);
                const filterTemplate = urlParams.get('template');
                
                // Get Queues
                const snapQueue = await window.fbGet(window.getAppRef('queue'));
                const qData = snapQueue.val();
                let pending = [];
                if(qData) {
                    const singleId = urlParams.get('id');
                    let allQs = Object.keys(qData).map(k => ({id: k, ...qData[k]}));
                    if (singleId) {
                        pending = allQs.filter(q => q.id === singleId);
                    } else {
                        pending = allQs.filter(q => q.status === 'pending');
                        if (filterTemplate) {
                            pending = pending.filter(q => (q.template_id || 'default') === filterTemplate);
                        }
                        pending.sort((a,b) => a.timestamp - b.timestamp);
                    }
                }
                
                const container = document.getElementById('page-container');
                
                if(pending.length === 0) {
                    container.innerHTML = '<p style="color:white; text-align:center; width:100%;">Antrean kosong.</p>';
                    return;
                }
                
                // Pre-fetch settings & backgrounds for all unique template_ids in pending
                const uniqueTemplates = [...new Set(pending.map(q => q.template_id || 'default'))];
                const templatesData = {};
                for (const tId of uniqueTemplates) {
                    const sPath = tId === 'default' ? 'settings/print' : `settings/templates/${tId}/print`;
                    const bPath = tId === 'default' ? 'settings/background' : `settings/templates/${tId}/background`;
                    
                    const [sSnap, bSnap] = await Promise.all([
                        window.fbGet(window.getAppRef(sPath)),
                        window.fbGet(window.getAppRef(bPath))
                    ]);
                    
                    templatesData[tId] = {
                        settings: sSnap.val() || {},
                        bgUrl: bSnap.val() || ''
                    };
                }
                
                let html = '';
                pending.forEach(q => {
                    const qTplId = q.template_id || 'default';
                    const qDataTemplates = templatesData[qTplId] || { settings: {}, bgUrl: '' };
                    const settings = qDataTemplates.settings;
                    const bUrl = qDataTemplates.bgUrl;
                    const pBgStyle = bUrl ? `background-image: url('${bUrl}');` : '';
                    
                    // Map element IDs to queue data
                    let dataMap = {
                        'name': q.participant_name || ''
                    };
                    if(q.dynamic_data) {
                        dataMap = { ...dataMap, ...q.dynamic_data };
                    }

                    // Build elements HTML dynamically
                    let elementsHtml = '';
                    
                    if (settings._elements) {
                        // New dynamic format
                        settings._elements.forEach(elSetting => {
                            const text = dataMap[elSetting.id] || dataMap[elSetting.label] || '';
                            if (!text) return;
                            const fb = elSetting.font_family === 'Times New Roman' ? 'serif' : 'sans-serif';
                            loadGoogleFont(elSetting.font_family);
                            const style = `position:absolute; width:100%; left:${elSetting.x_pos}px; top:${elSetting.y_pos}px; font-size:${elSetting.font_size}px; text-align:${elSetting.align}; font-weight:${elSetting.is_bold?'bold':'normal'}; color:${elSetting.color}; font-family:'${elSetting.font_family}',${fb};`;
                            elementsHtml += `<div style="${style}">${escapeHTML(text)}</div>`;
                        });
                    } else {
                        // Legacy format fallback
                        Object.keys(settings).forEach(key => {
                            if (key.startsWith('_')) return;
                            const text = dataMap[key] || '';
                            if (!text) return;
                            const s = settings[key];
                            const fb = s.font_family === 'Times New Roman' ? 'serif' : 'sans-serif';
                            loadGoogleFont(s.font_family);
                            const style = `position:absolute; width:100%; left:${s.x_pos}px; top:${s.y_pos}px; font-size:${s.font_size}px; text-align:${s.align}; font-weight:${s.is_bold?'bold':'normal'}; color:${s.color}; font-family:'${s.font_family}',${fb};`;
                            elementsHtml += `<div style="${style}">${escapeHTML(text)}</div>`;
                        });
                    }

                    html += `
                        <div class="print-wrapper">
                            <div class="print-page" style="${pBgStyle}">
                                ${elementsHtml}
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        }, 100);
    });
    </script>
</body>
</html>
