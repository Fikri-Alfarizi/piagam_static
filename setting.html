<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Layout Editor - PiagamFast</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Alex+Brush&family=Allura&family=Cinzel:wght@400;700&family=Dancing+Script&family=Great+Vibes&family=Lora:ital,wght@0,400;0,700;1,400&family=Merriweather:wght@400;700&family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Oswald:wght@400;600&family=Parisienne&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@400;600;700&family=PT+Serif:wght@400;700&family=Roboto:wght@400;500;700&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Specific Styles for Layout Editor */
        .layout-editor-wrapper {
            display: flex;
            gap: 20px;
            height: calc(100vh - 180px);
            min-height: 600px;
        }

        /* Sidebar Sidebar */
        .editor-sidebar {
            width: 380px;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: #f8fafc;
        }
        .sidebar-header label { font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 8px; }
        
        .template-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .template-controls select {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
        }
        .btn-add-tpl { background: #1e293b; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-del-tpl { background: #fee2e2; color: #b91c1c; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }

        .elements-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid var(--border);
        }
        .elements-header h3 { margin: 0; font-size: 15px; font-weight: 800; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .elements-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f1f5f9;
        }

        /* Element Cards */
        .element-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: all 0.2s;
        }
        .element-card.active {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
        }

        .element-card-header {
            padding: 12px 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .el-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .el-name { font-weight: 700; color: #1e293b; font-size: 14px; }
        .el-actions button {
            background: transparent; border: none; cursor: pointer; font-size: 14px; padding: 4px; border-radius: 4px;
        }
        .el-actions button:hover { background: #e2e8f0; }

        .mapping-box {
            background: #e0e7ff;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mapping-box label { font-size: 11px; font-weight: 700; color: #4338ca; white-space: nowrap; margin:0;}
        .mapping-box select {
            flex: 1;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #a5b4fc;
            font-size: 12px;
            font-weight: 600;
            color: #312e81;
            background: white;
        }

        .element-card-body {
            padding: 16px;
            display: none;
        }
        .element-card.active .element-card-body {
            display: block;
        }

        .prop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .prop-grid.full { grid-template-columns: 1fr; }
        .prop-item label { display: block; font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
        .prop-item input[type="text"], .prop-item input[type="number"], .prop-item select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 13px;
        }
        .prop-item input[type="color"] {
            width: 100%;
            height: 30px;
            padding: 0;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
        }

        .sidebar-footer {
            padding: 16px;
            background: white;
            border-top: 1px solid var(--border);
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            background: #e2e8f0;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .canvas-toolbar {
            padding: 12px 20px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .canvas-viewport {
            flex: 1;
            overflow: auto;
            position: relative;
            background: #94a3b8;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        #preview-wrapper {
            width: 1123px; /* A4 Landscape at 96dpi approx */
            height: 794px;
            background: white;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            transform-origin: top center;
        }

        #print-preview-area {
            width: 1123px;
            height: 794px;
            position: absolute;
            top: 0; left: 0;
            background-size: cover;
            background-position: center;
            background-color: white;
            transform-origin: top left;
        }

        .draggable {
            position: absolute;
            cursor: move;
            user-select: none;
            white-space: nowrap;
            line-height: 1.2;
            padding: 2px 4px;
            border: 2px dashed transparent;
        }
        .draggable:hover { border-color: rgba(59,130,246,0.5); }
        .draggable.selected { border-color: #3b82f6; background: rgba(59,130,246,0.1); z-index: 10; }
        .draggable.dragging { opacity: 0.8; }

    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">PiagamFast</div>
                        <nav class="sidebar-nav">
                <a href="index.html" id="nav-index">Dashboard</a>
                <a href="participants.html" id="nav-participants">Data Peserta</a>
                <a href="import.html" id="nav-import">Import</a>
                <a href="queue.html" id="nav-queue">Antrean</a>
                <a href="setting.html" id="nav-setting">Setting</a>
            </nav>
        </aside>
        <main class="main-content">
            <div class="container" style="max-width: 1600px;">
                <div class="card layout-editor-wrapper">
                    <!-- SIDEBAR -->
        <div class="editor-sidebar">
            <div class="sidebar-header">
                <label>Template Aktif</label>
                <div class="template-controls">
                    <select id="template-selector"></select>
                    <button class="btn-add-tpl" id="btn-add-template" title="Buat Template Baru">+ Baru</button>
                    <button class="btn-del-tpl" id="btn-del-template" title="Hapus Template" style="display:none;">🗑️</button>
                </div>
            </div>

            <div class="elements-header">
                <h3>Elemen Teks</h3>
                <button class="btn btn-primary btn-sm" id="btn-add-element">+ Tambah</button>
            </div>

            <div class="elements-list" id="elements-list">
                <!-- Elements injected here via JS -->
            </div>

            <div class="sidebar-footer">
                <button class="btn btn-primary" style="width:100%; font-size:15px; padding:12px;" onclick="saveSettings()">
                    💾 Simpan Semua Perubahan
                </button>
                <div id="save-status" style="text-align:center; font-size:12px; color:#10b981; font-weight:bold; margin-top:8px; height:15px;"></div>
            </div>
        </div>

        <!-- CANVAS -->
        <div class="canvas-area">
            <div class="canvas-toolbar">
                <div style="font-size:13px; color:#64748b; flex:1;">
                    💡 Klik elemen di daftar (kiri) atau klik & geser langsung teks di bawah.
                </div>
                <div style="display:flex; gap:10px; align-items:center;">
                    <input type="file" id="bg-upload" accept="image/*" style="font-size:12px;">
                    <button class="btn btn-secondary btn-sm" id="btn-bg" onclick="uploadBg()">Set Background</button>
                </div>
            </div>

            <div class="canvas-viewport">
                <div id="preview-wrapper">
                    <div id="print-preview-area"></div>
                </div>
            </div>
        </div> <!-- end canvas-area -->
    </div> <!-- end card -->
</div> <!-- end container -->
</main>
</div> <!-- end app-layout -->

<!-- Firebase Scripts -->
<script type="module" src="js/firebase-init.js"></script>
<script type="module" src="js/app.js"></script>

<script>
// ==========================================
// 1. STATE & CONSTANTS
// ==========================================
const DEFAULT_ELEMENTS = [
    { id: 'name', label: 'Nama Peserta', preview_text: 'Budi Santoso (Contoh)', x: 0, y: 0, size: 24, align: 'center', font: 'Arial', color: '#000000', bold: false, mapping: '' },
    { id: 'category', label: 'Juara / Kategori', preview_text: 'Juara 1 Kumite Bebas', x: 0, y: 60, size: 24, align: 'center', font: 'Arial', color: '#000000', bold: false, mapping: '' }
];

const AVAILABLE_FONTS = [
    // Standar OS
    'Arial', 'Times New Roman', 'Courier New', 'Georgia', 'Verdana', 'Trebuchet MS', 'Impact', 'Comic Sans MS',
    // Google Fonts (Serif Klasik)
    'Playfair Display', 'Merriweather', 'Lora', 'Cinzel', 'PT Serif',
    // Google Fonts (Script / Latin / Kaligrafi)
    'Great Vibes', 'Alex Brush', 'Pinyon Script', 'Tangerine', 'Dancing Script', 'Parisienne', 'Allura',
    // Google Fonts (Modern Sans)
    'Montserrat', 'Roboto', 'Open Sans', 'Poppins', 'Oswald'
];

let elements = [];
let participantColumns = [];
let activeElementId = null;
let currentTemplateId = 'default';
let currentScale = 1;

// ==========================================
// 2. HELPER FUNCTIONS
// ==========================================
function escapeHtml(str) {
    if(!str) return '';
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getSettingsPath() {
    return currentTemplateId === 'default' ? 'settings/print' : `settings/templates/${currentTemplateId}/print`;
}

function getBgPath() {
    return currentTemplateId === 'default' ? 'settings/background' : `settings/templates/${currentTemplateId}/background`;
}

function sanitizeFirebaseArray(dataArray, fallback = []) {
    if (!dataArray) return fallback;
    if (Array.isArray(dataArray)) return dataArray.filter(e => e !== null && e !== undefined);
    if (typeof dataArray === 'object') return Object.values(dataArray).filter(e => e !== null && e !== undefined);
    return fallback;
}

function getMappingOptionsHtml(selectedMapping) {
    let html = '<option value="">-- Bebas (Input Manual) --</option>';
    participantColumns.forEach(c => {
        if (!c || !c.id) return;
        const selected = (c.id === selectedMapping) ? 'selected' : '';
        html += `<option value="${c.id}" ${selected}>Kolom: ${escapeHtml(c.label)}</option>`;
    });
    return html;
}

function getFontOptionsHtml(selectedFont) {
    let html = '';
    AVAILABLE_FONTS.forEach(f => {
        const selected = (f === selectedFont) ? 'selected' : '';
        html += `<option value="${f}" style="font-family:'${f}'" ${selected}>${f}</option>`;
    });
    return html;
}

// ==========================================
// 3. UI RENDERERS
// ==========================================
function renderElementsList() {
    const container = document.getElementById('elements-list');
    container.innerHTML = '';
    
    if (elements.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 20px; color:#94a3b8; font-size:13px;">Belum ada elemen. Klik "+ Tambah" di atas.</div>';
        return;
    }

    elements.forEach(el => {
        const card = document.createElement('div');
        card.className = 'element-card' + (activeElementId === el.id ? ' active' : '');
        card.innerHTML = `
            <div class="element-card-header" onclick="selectElement('${el.id}')">
                <div class="el-title-row">
                    <span class="el-name">📝 ${escapeHtml(el.label)}</span>
                    <span class="el-actions">
                        <button onclick="event.stopPropagation(); renameElement('${el.id}')" title="Rename" style="color:#4338ca;">✏️</button>
                        <button onclick="event.stopPropagation(); deleteElement('${el.id}')" title="Hapus" style="color:#b91c1c;">🗑️</button>
                    </span>
                </div>
                <div class="mapping-box" onclick="event.stopPropagation();">
                    <label>🔗 Hubungkan:</label>
                    <select onchange="updateEl('${el.id}', 'mapping', this.value)">
                        ${getMappingOptionsHtml(el.mapping)}
                    </select>
                </div>
            </div>
            
            <div class="element-card-body">
                <div class="prop-grid full">
                    <div class="prop-item">
                        <label>Teks Preview (Contoh di layar)</label>
                        <input type="text" value="${escapeHtml(el.preview_text)}" oninput="updateEl('${el.id}', 'preview_text', this.value)">
                    </div>
                </div>
                <div class="prop-grid">
                    <div class="prop-item"><label>Posisi X (px)</label><input type="number" value="${el.x}" oninput="updateEl('${el.id}', 'x', parseInt(this.value)||0)"></div>
                    <div class="prop-item"><label>Posisi Y (px)</label><input type="number" value="${el.y}" oninput="updateEl('${el.id}', 'y', parseInt(this.value)||0)"></div>
                </div>
                <div class="prop-grid full">
                    <div class="prop-item">
                        <label>Jenis Font</label>
                        <select onchange="updateEl('${el.id}', 'font', this.value)">${getFontOptionsHtml(el.font)}</select>
                    </div>
                </div>
                <div class="prop-grid">
                    <div class="prop-item">
                        <label>Ukuran Font</label>
                        <input type="number" value="${el.size}" oninput="updateEl('${el.id}', 'size', parseInt(this.value)||10)">
                    </div>
                    <div class="prop-item">
                        <label>Warna Teks</label>
                        <input type="color" value="${el.color || '#000000'}" onchange="updateEl('${el.id}', 'color', this.value)">
                    </div>
                </div>
                <div class="prop-grid">
                    <div class="prop-item">
                        <label>Perataan (Align)</label>
                        <select onchange="updateEl('${el.id}', 'align', this.value)">
                            <option value="left" ${el.align==='left'?'selected':''}>Kiri (Left)</option>
                            <option value="center" ${el.align==='center'?'selected':''}>Tengah (Center)</option>
                            <option value="right" ${el.align==='right'?'selected':''}>Kanan (Right)</option>
                        </select>
                    </div>
                    <div class="prop-item" style="display:flex; align-items:flex-end;">
                        <label style="display:flex; align-items:center; gap:6px; cursor:pointer; color:#0f172a; padding:6px 0; font-size:13px; font-weight:700; text-transform:none;">
                            <input type="checkbox" ${el.bold?'checked':''} onchange="updateEl('${el.id}', 'bold', this.checked)" style="width:16px; height:16px;">
                            Cetak Tebal (Bold)
                        </label>
                    </div>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}

function renderPreview() {
    const area = document.getElementById('print-preview-area');
    area.innerHTML = ''; // Bersihkan canvas
    
    elements.forEach(el => {
        const div = document.createElement('div');
        div.className = 'draggable' + (activeElementId === el.id ? ' selected' : '');
        div.setAttribute('data-id', el.id);
        
        // Setup styles
        div.style.left = `${el.x}px`;
        div.style.top = `${el.y}px`;
        div.style.fontSize = `${el.size}px`;
        div.style.textAlign = el.align || 'center';
        div.style.fontWeight = el.bold ? 'bold' : 'normal';
        div.style.color = el.color || '#000000';
        div.style.fontFamily = `'${el.font}', sans-serif`;
        div.style.width = el.align === 'center' ? '100%' : 'auto';
        if(el.align === 'center') {
            div.style.left = '0';
        }
        
        div.textContent = el.preview_text || el.label;
        area.appendChild(div);
    });
    
    attachDragListeners();
}

function fitPreviewToScreen() {
    const wrapper = document.getElementById('preview-wrapper');
    const preview = document.getElementById('print-preview-area');
    const viewport = document.querySelector('.canvas-viewport');
    if(!viewport) return;
    
    const availableWidth = viewport.clientWidth - 80; // padding
    currentScale = Math.min(1, availableWidth / 1123);
    if (currentScale < 0.2) currentScale = 0.5; // fallback
    
    preview.style.transform = `scale(${currentScale})`;
    wrapper.style.width = (1123 * currentScale) + 'px';
    wrapper.style.height = (794 * currentScale) + 'px';
}

window.addEventListener('resize', fitPreviewToScreen);

// ==========================================
// 4. INTERACTIVITY & EVENTS
// ==========================================
window.selectElement = function(id) {
    activeElementId = (activeElementId === id) ? null : id;
    renderElementsList();
    renderPreview();
};

window.updateEl = function(id, prop, val) {
    const el = elements.find(e => e.id === id);
    if (el) {
        el[prop] = val;
        renderPreview();
    }
};

document.getElementById('btn-add-element').addEventListener('click', () => {
    const name = prompt('Nama elemen teks baru (misal: "Nomor Sertifikat"):');
    if (!name) return;
    
    const id = 'el_' + Date.now() + Math.floor(Math.random()*1000);
    elements.push({
        id: id,
        label: name,
        preview_text: name,
        x: 50,
        y: 50 + (elements.length * 40),
        size: 24,
        align: 'center',
        font: 'Arial',
        color: '#000000',
        bold: false,
        mapping: ''
    });
    
    activeElementId = id;
    renderElementsList();
    renderPreview();
});

window.renameElement = function(id) {
    const el = elements.find(e => e.id === id);
    if(!el) return;
    const newName = prompt('Ubah nama elemen:', el.label);
    if(newName) {
        el.label = newName;
        renderElementsList();
    }
};

window.deleteElement = function(id) {
    if(confirm('Hapus elemen ini?')) {
        elements = elements.filter(e => e.id !== id);
        if(activeElementId === id) activeElementId = null;
        renderElementsList();
        renderPreview();
    }
};

// --- DRAG LOGIC ---
let isDragging = false, dragEl = null, startX = 0, startY = 0, initX = 0, initY = 0;

function attachDragListeners() {
    const draggables = document.querySelectorAll('#print-preview-area .draggable');
    draggables.forEach(div => {
        div.onmousedown = function(e) {
            isDragging = true;
            dragEl = this;
            dragEl.classList.add('dragging');
            
            startX = e.clientX;
            startY = e.clientY;
            
            const elId = dragEl.getAttribute('data-id');
            const elObj = elements.find(el => el.id === elId);
            initX = elObj ? elObj.x : 0;
            initY = elObj ? elObj.y : 0;
            
            if (activeElementId !== elId) {
                activeElementId = elId;
                renderElementsList();
            }
            e.preventDefault();
        };
    });
}

document.onmousemove = function(e) {
    if (!isDragging || !dragEl) return;
    const dx = (e.clientX - startX) / currentScale;
    const dy = (e.clientY - startY) / currentScale;
    
    const newX = Math.round(initX + dx);
    const newY = Math.round(initY + dy);
    
    dragEl.style.left = newX + 'px';
    dragEl.style.top = newY + 'px';
    
    const elId = dragEl.getAttribute('data-id');
    const el = elements.find(o => o.id === elId);
    if (el) {
        el.x = newX;
        el.y = newY;
    }
};

document.onmouseup = function() {
    if (isDragging && dragEl) {
        dragEl.classList.remove('dragging');
        isDragging = false;
        dragEl = null;
        renderElementsList(); // Update input values in sidebar
    }
};

// ==========================================
// 5. FIREBASE DATA LOADING & SAVING
// ==========================================
function loadTemplateData() {
    if (!window.fbDb) return;
    
    // 1. Load Background
    window.fbOnValue(window.getAppRef(getBgPath()), (snap) => {
        const bg = snap.val();
        document.getElementById('print-preview-area').style.backgroundImage = bg ? `url('${bg}')` : 'none';
    });

    // 2. Load Elements
    window.fbOnValue(window.getAppRef(getSettingsPath()), (snap) => {
        try {
            const data = snap.val();
            if (data && data._elements) {
                // Safe parsing of sparse arrays
                const rawElements = sanitizeFirebaseArray(data._elements);
                elements = rawElements.map(e => ({
                    id: e.id || ('el_'+Math.random()),
                    label: e.label || 'Teks',
                    preview_text: e.preview_text || e.label || '',
                    x: parseInt(e.x_pos) || 0,
                    y: parseInt(e.y_pos) || 0,
                    size: parseInt(e.font_size) || 24,
                    align: e.align || 'center',
                    font: e.font_family || 'Arial',
                    color: e.color || '#000000',
                    bold: e.is_bold ? true : false,
                    mapping: e.mapping || ''
                }));
            } else {
                // Initial Default
                elements = JSON.parse(JSON.stringify(DEFAULT_ELEMENTS));
            }
            
            renderElementsList();
            renderPreview();
            fitPreviewToScreen();
        } catch (err) {
            console.error("Gagal memuat elemen dari Firebase:", err);
            alert("Terjadi kesalahan saat membaca layout. Silakan muat ulang halaman.");
        }
    });
}

function switchTemplate(tplId) {
    currentTemplateId = tplId;
    document.getElementById('btn-del-template').style.display = (tplId === 'default') ? 'none' : 'inline-block';
    loadTemplateData();
}

window.saveSettings = async function() {
    try {
        const dataToSave = {
            _elements: elements.map(el => ({
                id: el.id,
                label: el.label,
                preview_text: el.preview_text,
                x_pos: String(el.x),
                y_pos: String(el.y),
                font_size: String(el.size),
                align: el.align,
                font_family: el.font,
                color: el.color,
                is_bold: el.bold ? 1 : 0,
                mapping: el.mapping || ''
            }))
        };
        await window.fbSet(window.getAppRef(getSettingsPath()), dataToSave);
        
        const statusEl = document.getElementById('save-status');
        statusEl.innerText = '✅ Berhasil disimpan ke Firebase!';
        setTimeout(() => statusEl.innerText = '', 3000);
    } catch(err) {
        alert('Gagal menyimpan: ' + err.message);
    }
};

window.uploadBg = function() {
    const file = document.getElementById('bg-upload').files[0];
    if(!file) return alert('Pilih file gambar terlebih dahulu.');
    
    const btn = document.getElementById('btn-bg');
    btn.innerText = '⏳ Uploading...';
    btn.disabled = true;
    
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            await window.fbSet(window.getAppRef(getBgPath()), e.target.result);
            alert('Background sukses diunggah!');
        } catch(err) {
            alert('Gagal: Ukuran gambar mungkin terlalu besar.');
        }
        btn.innerText = 'Set Background';
        btn.disabled = false;
    };
    reader.readAsDataURL(file);
};

// ==========================================
// 6. INITIALIZATION
// ==========================================
const initInterval = setInterval(() => {
    if(window.fbDb && window.fbUser) {
        clearInterval(initInterval);
        
        // 1. Load Participant Columns for mapping
        window.fbOnValue(window.getAppRef('participant_columns'), (snap) => {
            const data = snap.val();
            participantColumns = sanitizeFirebaseArray(data);
            renderElementsList(); // Update dropdowns if needed
        });

        // 2. Load Templates Meta List
        const tplSelect = document.getElementById('template-selector');
        window.fbOnValue(window.getAppRef('settings/templates_meta'), (snap) => {
            const meta = snap.val() || {};
            let opts = '<option value="default">Piagam Default</option>';
            Object.keys(meta).forEach(k => {
                opts += `<option value="${k}">${escapeHtml(meta[k].name)}</option>`;
            });
            tplSelect.innerHTML = opts;
            tplSelect.value = currentTemplateId;
        });

        tplSelect.onchange = (e) => switchTemplate(e.target.value);

        // 3. Template Buttons
        document.getElementById('btn-add-template').onclick = async () => {
            const name = prompt('Nama template baru:');
            if(!name) return;
            const id = 'tpl_' + Date.now();
            await window.fbSet(window.getAppRef(`settings/templates_meta/${id}`), { name, created_at: Date.now() });
            tplSelect.value = id;
            switchTemplate(id);
        };

        document.getElementById('btn-del-template').onclick = async () => {
            if(currentTemplateId === 'default' || !confirm('Hapus template ini secara permanen?')) return;
            await window.fbRemove(window.getAppRef(`settings/templates_meta/${currentTemplateId}`));
            await window.fbRemove(window.getAppRef(`settings/templates/${currentTemplateId}`));
            tplSelect.value = 'default';
            switchTemplate('default');
        };

        // 4. Start Loading Data
        switchTemplate('default');
    }
}, 50);

</script>
