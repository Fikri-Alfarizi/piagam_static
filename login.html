<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://www.gstatic.com; connect-src 'self' https://*.firebasedatabase.app https://generativelanguage.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:;">
    <title>Login - PiagamFast</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-sidebar);
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            text-align: center;
        }
        .login-brand {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -1px;
            color: var(--text-main);
        }
        .login-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
        }
        .error-message {
            color: #dc2828;
            background: #fef2f2;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #fecaca;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script src="js/security.js"></script>
</head>
<body>

    <div class="login-card">
        <div class="login-brand">PiagamFast</div>
        <div class="login-subtitle">Masuk untuk mengakses sistem</div>
        
        <div id="error-msg" class="error-message">Email atau password salah.</div>

        <form id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="admin@piagamfast.com" autocomplete="email">
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" id="btn-login" style="width: 100%; padding: 14px; font-size: 16px;">Masuk Aplikasi</button>
        </form>
    </div>

    <!-- Firebase Scripts -->
    <script type="module" src="js/firebase-init.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const btnLogin = document.getElementById('btn-login');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            errorMsg.style.display = 'none';
            btnLogin.innerHTML = '<span class="loader"></span> Memproses...';
            btnLogin.disabled = true;

            try {
                // Gunakan fungsi login dari firebase-init
                await window.fbLogin(email, password);
                // Jika sukses, onAuthStateChanged di firebase-init akan me-redirect ke index.html
            } catch (error) {
                console.error("Login gagal:", error);
                errorMsg.innerText = "Gagal masuk: Periksa kembali email dan password Anda.";
                errorMsg.style.display = 'block';
                btnLogin.innerHTML = 'Masuk Aplikasi';
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
